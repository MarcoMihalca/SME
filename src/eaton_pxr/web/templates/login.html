<!DOCTYPE html>
<html lang="ro" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autentificare — SME</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('sme_theme_v2') || localStorage.getItem('sme_theme_v1');
        if (saved === 'light') {
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    /*
     * Hallmark Provenance:
     * Theme: emerald-obsidian-minimal
     * Macrostructure: centered-minimal-auth
     * Stamp: 2026-11-25 | Version: 4.0.0
     * Waivers: none
     */
    :root {
      --bg: #F4F7FB;
      --bg-orb-1: rgba(13, 148, 136, 0.14);
      --bg-orb-2: rgba(2, 132, 199, 0.12);
      --surface: rgba(255, 255, 255, 0.88);
      --surface-input: #F8FAFC;
      --surface-input-focus: #FFFFFF;
      --ink: #0F172A;
      --ink-secondary: #334155;
      --ink-muted: #64748B;
      --border: rgba(148, 163, 184, 0.32);
      --border-hover: rgba(100, 116, 139, 0.55);
      --accent: #0D9488;
      --accent-solid: #0F766E;
      --accent-solid-hover: #115E59;
      --accent-soft: rgba(13, 148, 136, 0.12);
      --accent-ring: rgba(13, 148, 136, 0.24);
      --danger: #991B1B;
      --danger-bg: #FEF2F2;
      --danger-border: #FECACA;
      --radius-sm: 12px;
      --radius-lg: 24px;
      --radius-pill: 9999px;
      --shadow-card: 0 24px 64px rgba(15, 23, 42, 0.08), 0 4px 16px rgba(15, 23, 42, 0.04);
      --shadow-btn: 0 8px 22px rgba(15, 118, 110, 0.28);
      --font-sans: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Roboto", sans-serif;
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    [data-theme="dark"] {
      --bg: #060A11;
      --bg-orb-1: rgba(20, 184, 166, 0.16);
      --bg-orb-2: rgba(56, 189, 248, 0.12);
      --surface: rgba(13, 21, 34, 0.84);
      --surface-input: rgba(19, 31, 51, 0.78);
      --surface-input-focus: #131F33;
      --ink: #F8FAFC;
      --ink-secondary: #CBD5E1;
      --ink-muted: #94A3B8;
      --border: rgba(148, 163, 184, 0.18);
      --border-hover: rgba(148, 163, 184, 0.36);
      --accent: #2DD4BF;
      --accent-solid: #0F766E;
      --accent-solid-hover: #0D9488;
      --accent-soft: rgba(45, 212, 191, 0.14);
      --accent-ring: rgba(45, 212, 191, 0.26);
      --danger: #FECACA;
      --danger-bg: rgba(239, 68, 68, 0.16);
      --danger-border: rgba(239, 68, 68, 0.42);
      --shadow-card: 0 28px 80px rgba(0, 0, 0, 0.62), 0 4px 20px rgba(0, 0, 0, 0.36);
      --shadow-btn: 0 10px 26px rgba(13, 148, 136, 0.36);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    ::selection {
      background: var(--accent-soft);
      color: var(--ink);
    }

    html {
      font-size: 16px;
      overflow-x: clip;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: clip;
      position: relative;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      line-height: 1.5;
    }

    h1, h2, h3, h4, h5, h6 {
      overflow-wrap: break-word;
      min-width: 0;
    }

    button, input {
      font-family: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Ambient Animated Background Orbs */
    .ambient-stage {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(72px);
      will-change: transform, opacity;
    }

    .orb-1 {
      width: 440px;
      height: 440px;
      top: -120px;
      left: calc(50% - 340px);
      background: var(--bg-orb-1);
      animation: floatOrbA 14s ease-in-out infinite alternate;
    }

    .orb-2 {
      width: 380px;
      height: 380px;
      bottom: -110px;
      right: calc(50% - 320px);
      background: var(--bg-orb-2);
      animation: floatOrbB 17s ease-in-out infinite alternate;
    }

    @keyframes floatOrbA {
      0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.75; }
      100% { transform: translate3d(50px, 40px, 0) scale(1.12); opacity: 1; }
    }

    @keyframes floatOrbB {
      0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.7; }
      100% { transform: translate3d(-45px, -35px, 0) scale(1.1); opacity: 0.95; }
    }

    /* Floating Theme Switcher */
    .theme-corner {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
      animation: fadeDown 500ms var(--ease-spring) both;
    }

    .theme-btn {
      min-height: 44px;
      padding: 0 16px;
      border-radius: var(--radius-pill);
      background: var(--surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      color: var(--ink-secondary);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      touch-action: manipulation;
      transition: transform 200ms var(--ease-spring), border-color 200ms var(--ease-out), color 200ms var(--ease-out);
    }

    .theme-btn:hover {
      border-color: var(--accent);
      color: var(--ink);
      transform: translateY(-2px);
    }

    .theme-btn:active {
      transform: scale(0.96);
    }

    /* Centered Minimalist Login Card */
    .login-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 410px;
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 40px 36px 36px;
      animation: cardEntrance 620ms var(--ease-spring) both;
    }

    .login-card.shake {
      animation: errorShake 420ms var(--ease-out);
    }

    @keyframes cardEntrance {
      0% {
        opacity: 0;
        transform: translate3d(0, 24px, 0) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    @keyframes fadeDown {
      0% { opacity: 0; transform: translate3d(0, -12px, 0); }
      100% { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    @keyframes itemReveal {
      0% { opacity: 0; transform: translate3d(0, 14px, 0); }
      100% { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    @keyframes errorShake {
      0%, 100% { transform: translate3d(0, 0, 0); }
      20% { transform: translate3d(-8px, 0, 0); }
      40% { transform: translate3d(7px, 0, 0); }
      60% { transform: translate3d(-5px, 0, 0); }
      80% { transform: translate3d(4px, 0, 0); }
    }

    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.65; }
      70% { transform: scale(1.22); opacity: 0; }
      100% { transform: scale(1.22); opacity: 0; }
    }

    @keyframes spinLoader {
      to { transform: rotate(360deg); }
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: itemReveal 560ms var(--ease-spring) 80ms both;
    }

    .brand-icon-wrap {
      position: relative;
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: var(--accent-soft);
      border: 1px solid var(--border);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      transition: transform 280ms var(--ease-spring), border-color 280ms var(--ease-out);
    }

    .brand-icon-wrap::after {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 18px;
      border: 2px solid var(--accent);
      opacity: 0;
      animation: pulseRing 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    .login-card:hover .brand-icon-wrap {
      transform: translateY(-2px) scale(1.03);
      border-color: var(--accent);
    }

    .brand-header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--ink);
      line-height: 1.2;
    }

    .brand-sub {
      margin-top: 6px;
      font-size: 0.92rem;
      color: var(--ink-muted);
      max-width: 32ch;
    }

    .form-stack {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      animation: itemReveal 560ms var(--ease-spring) both;
    }

    .field:nth-child(1) { animation-delay: 150ms; }
    .field:nth-child(2) { animation-delay: 210ms; }

    .field label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink-secondary);
      transition: color 180ms var(--ease-out);
    }

    .field:focus-within label {
      color: var(--accent);
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 15px;
      color: var(--ink-muted);
      pointer-events: none;
      display: inline-flex;
      transition: color 200ms var(--ease-out), transform 200ms var(--ease-spring);
    }

    .input-wrap:focus-within .input-icon {
      color: var(--accent);
      transform: scale(1.08);
    }

    .field input {
      width: 100%;
      height: 48px;
      padding: 10px 14px 10px 44px;
      font-size: 1rem;
      color: var(--ink);
      background: var(--surface-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      caret-color: var(--accent);
      transition: border-color 200ms var(--ease-out), box-shadow 220ms var(--ease-spring), background-color 200ms var(--ease-out), transform 200ms var(--ease-spring);
    }

    .field input.has-toggle {
      padding-right: 48px;
    }

    .field input::placeholder {
      color: var(--ink-muted);
      opacity: 0.65;
    }

    .field input:hover {
      border-color: var(--border-hover);
    }

    .field input:focus {
      outline: none;
      background: var(--surface-input-focus);
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-ring);
    }

    .pw-toggle {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      background: transparent;
      border: none;
      border-radius: 9px;
      color: var(--ink-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      transition: color 180ms var(--ease-out), background-color 180ms var(--ease-out), transform 160ms var(--ease-spring);
    }

    .pw-toggle:hover {
      color: var(--ink);
      background: var(--accent-soft);
    }

    .pw-toggle:active {
      transform: translateY(-50%) scale(0.92);
    }

    .error-banner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger);
      font-size: 0.86rem;
      font-weight: 600;
      animation: itemReveal 260ms var(--ease-spring) both;
    }

    .error-banner.show {
      display: flex;
    }

    .submit-wrap {
      margin-top: 4px;
      animation: itemReveal 560ms var(--ease-spring) 270ms both;
    }

    .btn-submit {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 50px;
      background: var(--accent-solid);
      color: #FFFFFF;
      border: 1px solid var(--accent-solid);
      border-radius: var(--radius-sm);
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      box-shadow: var(--shadow-btn);
      touch-action: manipulation;
      transition: background-color 200ms var(--ease-out), transform 200ms var(--ease-spring), box-shadow 200ms var(--ease-out);
    }

    .btn-submit::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.22), transparent);
      transform: skewX(-20deg);
      transition: left 520ms var(--ease-out);
    }

    .btn-submit:hover:not(:disabled)::before {
      left: 140%;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--accent-solid-hover);
      transform: translateY(-2px);
    }

    .btn-submit:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2.2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spinLoader 700ms linear infinite;
    }

    .btn-submit.loading .btn-spinner {
      display: inline-block;
    }

    .btn-submit.loading .btn-arrow {
      display: none;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 22px 28px;
        border-radius: 20px;
      }

      .theme-corner {
        top: 14px;
        right: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-stage" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="theme-corner">
    <button type="button" class="theme-btn" id="btn-theme-toggle" aria-label="Comută tema Zi/Noapte">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2"></path>
        <path d="M12 20v2"></path>
        <path d="m4.93 4.93 1.41 1.41"></path>
        <path d="m17.66 17.66 1.41 1.41"></path>
        <path d="M2 12h2"></path>
        <path d="M20 12h2"></path>
        <path d="m6.34 17.66-1.41 1.41"></path>
        <path d="m19.07 4.93-1.41 1.41"></path>
      </svg>
      <span id="theme-toggle-label">Noapte</span>
    </button>
  </div>

  <main class="login-card" id="login-card" aria-labelledby="auth-heading">
    <div class="brand-header">
      <span class="brand-icon-wrap" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
        </svg>
      </span>
      <h1 id="auth-heading">Autentificare</h1>
      <p class="brand-sub">Conectează-te în platforma de monitorizare SME</p>
    </div>

    <form class="form-stack" id="login-form" novalidate>
      <div class="field">
        <label for="username">Utilizator</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
            autofocus
            placeholder="Nume utilizator"
          />
        </div>
      </div>

      <div class="field">
        <label for="password">Parolă</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input
            id="password"
            name="password"
            type="password"
            class="has-toggle"
            autocomplete="current-password"
            required
            placeholder="••••••••"
          />
          <button
            type="button"
            class="pw-toggle"
            id="btn-toggle-pw"
            aria-label="Afișează parola"
            aria-pressed="false"
          >
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="error-banner" id="login-error" role="alert" aria-live="polite">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="login-error-text"></span>
      </div>

      <div class="submit-wrap">
        <button type="submit" class="btn-submit" id="btn-login">
          <span class="btn-spinner" aria-hidden="true"></span>
          <span id="btn-login-label">Continuă</span>
          <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>
    </form>
  </main>

  <script>
    (function () {
      const THEME_KEY = 'sme_theme_v2';
      const themeBtn = document.getElementById('btn-theme-toggle');
      const themeLbl = document.getElementById('theme-toggle-label');

      function applyTheme(theme) {
        const isDark = theme === 'dark';
        if (isDark) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        if (themeLbl) {
          themeLbl.textContent = isDark ? 'Noapte' : 'Zi';
        }
      }

      const initialTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      applyTheme(initialTheme);

      if (themeBtn) {
        themeBtn.addEventListener('click', () => {
          const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          applyTheme(next);
          try {
            localStorage.setItem(THEME_KEY, next);
            localStorage.setItem('sme_theme_v1', next);
          } catch (e) {}
        });
      }

      const pwInput = document.getElementById('password');
      const pwToggle = document.getElementById('btn-toggle-pw');
      if (pwInput && pwToggle) {
        pwToggle.addEventListener('click', () => {
          const showing = pwInput.type === 'text';
          pwInput.type = showing ? 'password' : 'text';
          pwToggle.setAttribute('aria-pressed', showing ? 'false' : 'true');
          pwToggle.setAttribute('aria-label', showing ? 'Afișează parola' : 'Ascunde parola');
        });
      }

      const card = document.getElementById('login-card');
      const form = document.getElementById('login-form');
      const userEl = document.getElementById('username');
      const errBox = document.getElementById('login-error');
      const errText = document.getElementById('login-error-text');
      const submitBtn = document.getElementById('btn-login');
      const submitLbl = document.getElementById('btn-login-label');

      function triggerShake() {
        if (!card) return;
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
      }

      function setError(message) {
        if (message) {
          errText.textContent = message;
          errBox.classList.add('show');
          triggerShake();
        } else {
          errText.textContent = '';
          errBox.classList.remove('show');
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const username = userEl.value.trim();
        const password = pwInput.value;

        if (!username || !password) {
          setError('Completează utilizatorul și parola.');
          if (!username) userEl.focus();
          else pwInput.focus();
          return;
        }

        setError('');
        submitBtn.disabled = true;
        submitBtn.classList.add('loading');
        submitLbl.textContent = 'Se verifică...';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok) {
            submitLbl.textContent = 'Acces aprobat';
            window.location.href = '/';
            return;
          }
          setError(data.error || 'Date de autentificare incorecte.');
          pwInput.value = '';
          pwInput.focus();
        } catch (err) {
          setError('Conexiunea cu serverul a eșuat.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.classList.remove('loading');
          if (submitLbl.textContent !== 'Acces aprobat') {
            submitLbl.textContent = 'Continuă';
          }
        }
      });
    })();
  </script>
</body>
</html>
